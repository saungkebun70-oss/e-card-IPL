name: Build Mobile App (Android & iOS)

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'mobile/**'
      - '.github/workflows/build-mobile.yml'

defaults:
  run:
    working-directory: ./mobile

jobs:
  build-android:
    name: Build Android Release APK (Signed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21 (Temurin - Required by Capacitor 7 & Android SDK 35)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Root Dependencies & Build Web Bundle
        working-directory: .
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run build

      - name: Install Mobile Dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Prepare Optional google-services.json (FCM)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 ditemukan — mendekode ke mobile/google-services.json."
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 tidak diset — build tetap lanjut aman tanpa google-services.json."
          fi

      - name: Add & Sync Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi
          npx cap sync android

      - name: Generate Android Icons & Splash Screen
        run: |
          if [ -f "resources/icon.png" ]; then
            node scripts/prepare-assets.mjs
            npx @capacitor/assets generate --android --iconBackgroundColor '#0F172A' --splashBackgroundColor '#0F172A'
          else
            echo "resources/icon.png tidak ditemukan, lewati generate aset."
          fi

      - name: Inject AndroidManifest Permissions & Default Notification Channel
        run: node scripts/inject-android-manifest.mjs

      - name: Patch Android Gradle (Safe Conditional google-services Plugin)
        run: node scripts/patch-android-gradle.mjs

      - name: Prepare Android Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="android/app/saungkebun-release.jks"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 ditemukan — mendekode keystore release dari GitHub Secret."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          else
            echo "KEYSTORE_BASE64 belum diatur — membuat keystore release otomatis dengan keytool."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias saungkebun \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass saungkebun2026 \
              -keypass saungkebun2026 \
              -dname "CN=e-Card IPL Saung Kebun, OU=Pengurus Lingkungan, O=Perumahan Saung Kebun, L=Karawang, ST=Jawa Barat, C=ID"
          fi
          ls -lh "$KEYSTORE_PATH"

      - name: Build Android Release APK
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Align & Sign Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS_DIR="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [ -z "$BUILD_TOOLS_DIR" ] || [ ! -x "$BUILD_TOOLS_DIR/apksigner" ]; then
            echo "Error: Android build-tools (zipalign/apksigner) tidak ditemukan di $SDK_ROOT/build-tools"
            exit 1
          fi
          echo "Menggunakan Android build-tools: $BUILD_TOOLS_DIR"

          RELEASE_DIR="android/app/build/outputs/apk/release"
          if [ -f "$RELEASE_DIR/app-release-unsigned.apk" ]; then
            UNSIGNED_APK="$RELEASE_DIR/app-release-unsigned.apk"
          elif [ -f "$RELEASE_DIR/app-release.apk" ]; then
            UNSIGNED_APK="$RELEASE_DIR/app-release.apk"
          else
            echo "Error: Release APK tidak ditemukan di $RELEASE_DIR"
            ls -la "$RELEASE_DIR" || true
            exit 1
          fi

          ALIGNED_APK="$RELEASE_DIR/app-release-aligned.apk"
          SIGNED_APK="$RELEASE_DIR/e-Card-IPL-Saung-Kebun-release-signed.apk"
          KEYSTORE_PATH="android/app/saungkebun-release.jks"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            STORE_PASS="${KEYSTORE_PASSWORD:-saungkebun2026}"
            ALIAS="${KEY_ALIAS:-saungkebun}"
            KEY_PASS="${KEY_PASSWORD:-$STORE_PASS}"
          else
            STORE_PASS="saungkebun2026"
            ALIAS="saungkebun"
            KEY_PASS="saungkebun2026"
          fi

          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$SIGNED_APK"
          ls -lh "$SIGNED_APK"

      - name: Upload Signed Android Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: e-Card-IPL-Saung-Kebun-Android-Release-APK
          path: mobile/android/app/build/outputs/apk/release/e-Card-IPL-Saung-Kebun-release-signed.apk
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS Project (Simulator Verification)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure CocoaPods Installed
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version

      - name: Install Root Dependencies & Build Web Bundle
        working-directory: .
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install Mobile Dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Add & Sync iOS Platform
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Generate iOS Icons & Splash Screen
        run: |
          if [ -f "resources/icon.png" ]; then
            node scripts/prepare-assets.mjs
            npx @capacitor/assets generate --ios --iconBackgroundColor '#0F172A' --splashBackgroundColor '#0F172A'
          else
            echo "resources/icon.png tidak ditemukan, lewati generate aset."
          fi

      - name: Inject Usage Descriptions into Info.plist
        run: node scripts/inject-ios-plist.mjs

      - name: Install CocoaPods Dependencies
        run: |
          cd ios/App
          pod install --repo-update

      - name: Verify iOS Build (No Signing Required)
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../../build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Upload iOS Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: e-Card-IPL-Saung-Kebun-iOS-Project
          path: |
            mobile/ios/App
            !mobile/ios/App/Pods
          if-no-files-found: error
          retention-days: 14
