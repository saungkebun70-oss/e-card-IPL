name: Build Mobile App (Android & iOS)

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile.yml'

defaults:
  run:
    working-directory: ./mobile

jobs:
  build-android:
    name: Build Android APK (Debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21 (Temurin - Required by Capacitor 7 & Android SDK 35)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Mobile Dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Add & Sync Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate Android Icons & Splash Screen
        run: |
          if [ -f "resources/icon.png" ]; then
            node scripts/prepare-assets.mjs
            npx @capacitor/assets generate --android --iconBackgroundColor '#0F172A' --splashBackgroundColor '#0F172A'
          else
            echo "resources/icon.png tidak ditemukan, lewati generate aset."
          fi

      - name: Inject Required Permissions into AndroidManifest.xml
        run: node scripts/inject-android-manifest.mjs

      - name: Build Android Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: e-Card-IPL-Saung-Kebun-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS Project (Simulator Verification)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure CocoaPods Installed
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version

      - name: Install Mobile Dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Add & Sync iOS Platform
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Generate iOS Icons & Splash Screen
        run: |
          if [ -f "resources/icon.png" ]; then
            node scripts/prepare-assets.mjs
            npx @capacitor/assets generate --ios --iconBackgroundColor '#0F172A' --splashBackgroundColor '#0F172A'
          else
            echo "resources/icon.png tidak ditemukan, lewati generate aset."
          fi

      - name: Inject Usage Descriptions into Info.plist
        run: node scripts/inject-ios-plist.mjs

      - name: Install CocoaPods Dependencies
        run: |
          cd ios/App
          pod install --repo-update

      - name: Verify iOS Build (No Signing Required)
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../../build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Upload iOS Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: e-Card-IPL-Saung-Kebun-iOS-Project
          path: |
            mobile/ios/App
            !mobile/ios/App/Pods
          if-no-files-found: error
          retention-days: 14
