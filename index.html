    <meta property="og:title" content="e-Card Verifikasi &amp; IPL Digital — Perumahan Saung Kebun" />
    <meta property="og:description" content="Portal Warga &amp; Pengurus Lingkungan Perumahan Saung Kebun untuk verifikasi e-Card, setor IPL digital, e-Kwitansi, dan rekap kas lingkungan." />
    <meta property="og:type" content="website" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var valid = { emerald: '#F6F3EA', midnight: '#0b1410', ocean: '#f0f9ff', earth: '#faf8f5', royal: '#f8fafc' };
          var saved = window.localStorage.getItem('app_theme');
          var theme = saved && valid[saved] ? saved : 'emerald';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          if (theme === 'midnight') {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', valid[theme]);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--theme-bg)] text-[var(--theme-text)] antialiased selection:bg-[var(--theme-primary)]/15 selection:text-[var(--theme-primary-text)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
